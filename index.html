<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mensaje para Chinchulita</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff0f0;
            font-family: Arial, sans-serif;
        }
        .clickable {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            color: #ff0000;
        }
        .clickable:hover {
            transform: scale(1.05);
        }
        h1 {
            font-size: 80px;
            margin: 0;
        }
        .heart {
            font-size: 150px;
            margin-top: 20px;
            animation: beat 1s infinite;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="clickable" onclick="window.open('https://files.tiagohms.com/TE%20AMO%20CHINCHE.mp4', '_blank')">
        <h1>TE AMO CHINCHULITA</h1>
        <div class="heart">❤️</div>
    </div>
</body>
</html>
